name: PAM I - Validacao das fases e nota

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: pam-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar fases e gerar a nota
        id: nota
        run: node .github/scripts/pam-ci.mjs
        shell: bash

      - name: Publicar a nota na aba Actions (resumo)
        if: always()
        run: cat nota.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload do artefato com a nota atual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nota-pam
          path: |
            nota.md
            nota.json
          overwrite: true

      - name: Escrever a nota no README e no NOTA.md
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: node .github/scripts/publicar-nota.mjs
        shell: bash

      - name: Commitar a nota no repositorio (sem re-disparar o CI)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md NOTA.md
          if git diff --staged --quiet; then
            echo "Nota sem mudanca — nada a commitar."
          else
            git commit -m "docs: atualiza a nota automatica [skip ci]"
            git push
          fi
        shell: bash